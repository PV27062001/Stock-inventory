<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sri Amman</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F8F9FA; color: #202124;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { margin: 8px 0 0; font-size: 22px; }
    p { margin: 0; color: #5F6368; font-size: 15px; }
    button { margin-top: 12px; border: 0; border-radius: 9999px; padding: 12px 28px;
      background: #1A73E8; color: #fff; font-size: 16px; font-weight: 600; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <!-- Shown by the Android app when the live site cannot be reached. -->
  <main>
    <h1>No internet</h1>
    <p>Check Wi-Fi or mobile data, then try again.</p>
    <p>இணைய இணைப்பு இல்லை</p>
    <button type="button" onclick="location.replace('https://amman-samiyana-kadai.vercel.app/')">Retry</button>
  </main>
</body>
</html>
