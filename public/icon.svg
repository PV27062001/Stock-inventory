<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- App icon in the style of BrandLoader: blue ring with a spinner arc, around a rental
       shamiana (tent) with a table and two chairs. Full-bleed background and content inside
       the 80% safe zone, so it also works as a maskable icon. -->
  <rect width="512" height="512" fill="#F8F9FA"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#1A73E8" stroke-opacity="0.15" stroke-width="28"/>
  <path d="M134.4 134.4 A172 172 0 0 1 377.6 134.4" fill="none" stroke="#1A73E8" stroke-width="28"/>

  <!-- Tent: finial, striped roof, scalloped valance, poles -->
  <circle cx="256" cy="160" r="8" fill="#1A73E8"/>
  <polygon points="160,234 256,166 352,234" fill="#1A73E8" stroke="#1A73E8" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round">
    <line x1="256" y1="176" x2="208" y2="230"/>
    <line x1="256" y1="176" x2="256" y2="230"/>
    <line x1="256" y1="176" x2="304" y2="230"/>
  </g>
  <path d="M160 232 H352 V244 a16 14 0 0 1 -32 0 a16 14 0 0 1 -32 0 a16 14 0 0 1 -32 0 a16 14 0 0 1 -32 0 a16 14 0 0 1 -32 0 a16 14 0 0 1 -32 0 Z" fill="#4C9AFF"/>
  <rect x="168" y="250" width="9" height="104" rx="3" fill="#5F6368"/>
  <rect x="335" y="250" width="9" height="104" rx="3" fill="#5F6368"/>

  <!-- Table -->
  <g fill="#E37400">
    <rect x="224" y="298" width="64" height="11" rx="4"/>
    <rect x="231" y="309" width="7" height="45" rx="2"/>
    <rect x="274" y="309" width="7" height="45" rx="2"/>
  </g>

  <!-- Chairs (left faces right, right faces left) -->
  <g fill="#F29900">
    <rect x="188" y="284" width="8" height="70" rx="3"/>
    <rect x="188" y="318" width="28" height="8" rx="3"/>
    <rect x="208" y="326" width="8" height="28" rx="3"/>
    <rect x="316" y="284" width="8" height="70" rx="3"/>
    <rect x="296" y="318" width="28" height="8" rx="3"/>
    <rect x="296" y="326" width="8" height="28" rx="3"/>
  </g>

  <!-- Ground -->
  <rect x="152" y="352" width="208" height="7" rx="3.5" fill="#DADCE0"/>
</svg>
