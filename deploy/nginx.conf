# Reverse proxy for the Next.js app when self-hosting.
#
# IMPORTANT: this does NOT protect Firestore. The browser talks directly to
# firestore.googleapis.com, never through this server, so nginx cannot block
# database access. Only firestore.rules can. Keep those locked down.
#
# What this file does give you: a smaller public surface, security headers,
# no server banner, and rate limiting on the login path.

limit_req_zone $binary_remote_addr zone=app_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 6m;          # base64 ID photos are posted as JSON

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Never serve source maps or dotfiles.
    location ~ \.map$        { return 404; }
    location ~ /\.           { return 404; }

    # Build assets are content-hashed and safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Brute-force protection on sign-in.
    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Internal debug route: block from the public internet.
    location = /api/gold-debug { return 404; }

    # Allowlist of real application routes. Anything else 404s.
    location ~ ^/(_next/|favicon\.ico|manifest\.webmanifest|icon\.svg|sw\.js|robots\.txt)$ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/(|add|add-item|alerts|inventory|ledger|settings|login|kirayabook(/.*)?|api/(metal-rates|shutdown-news))$ {
        limit_req zone=app_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / { return 404; }
}
